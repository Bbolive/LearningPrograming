<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Entities</title>
</head>
<body>
    <h1 align="center">HTML Entities | Symbol</h1>
    <p>Devid &nbsp;&nbsp;Bracon</p>
    <!-- &nbsp; เป็นการเว้นระยะห่างระหว่างข้อความ -->
    <p>htm&nbsp;java&nbsp;css</p>
    <hr>
    5&gt;2
    <!-- &gt;คือเครื่องหมายมากกว่า หรือ > -->
    <hr>
    5&lt;3
    <!-- &gt;คือเครื่องหมายน้อยกว่า หรือ < -->
    <hr>
    <p> &empty; ห้ามเข้า</p>
    <!-- &empty คือ สัญลักษณ์ห้ามเข้า -->
    <hr>
    <p> &copy;html </p>
    <!-- &copy; คือ สัญลักษณ์ copyright -->
    <hr>
    <p> &reg; เครื่องหมายการค้า</p>
    <!-- &reg; คือ เครื่องหมายการค้า -->
    <hr>
    <p>&yen; สกุลเงินเยน 
    <p>&pound; สกุลเงิน pound</p>
    <p>&euro; สกุลเงินยูโร</p>
    <!-- เครื่องหมายสกุลเงิน -->
    <hr>
    <p>code ประกอบการสอน</p>
    <code>
        &lt;? php echo "Hello world" ?&gt;
        <!-- เป็นการนำเข้าโค้ดมาแสดง -->
    </code>
    <hr>
    <kbd>
        Ctrl+S
    </kbd>
    <hr>
    <a href="https://tools.w3cub.com/html-entities" target="_blank">เว็บสำหรับดู Entities</a>
</body>
</html>
