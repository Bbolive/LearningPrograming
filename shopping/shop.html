<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store</title>
</head>
<body>
    <h1>shopping</h1>
    <hr>
    <h1>รองเท้า</h1>
    <p>รายการสินค้า</p>
    <ol type="1">
        <li>รองเท้าส้นสูง</li>
        <li>รองเท้าผ้าใบ</li>
        <li>รองเท้าแตะ</li>
    </ol>
    <!-- <ol>ตามด้วยtype ที่ต้องการระบุเช่น 1,A,a,I,i <li>ชื่อรายการหรือlistทีาต้องการระบุ</li></ol> -->
    <!-- ol คือจะเรียงลำดับ -->
    <hr>
    <h1>เสื้อผ้า</h1>
    <ul type = square>
        <li>เสื้อแขนยาว</li>
        <li>เสื้อยืด</li>
        <li>กระโปรง</li>
    </ul>
    <!-- <ul>ตามด้วย <li>listที่ต้องการระบุ</li></ul> -->
    <!-- ul ไม่เรียงลำดับ -->
    <hr>
    <h1>เครื่องประดับ</h1>
    <ol type ="1">
        <li><b>แหวน</b>
        <!-- เพิ่มแท็ก <b>แหวน</b> เพื่อให้เป็นตัวหนา -->
            <ul type = aquare>
                <li>แหวนทอง</li>
                <li>แหวนเงิน</li>
                <li>แหวนแสตนเลท</li>
            </ul>
            <!-- สมารถระบุ ol ร่วมกับ ul ได้ -->
        </li>
        <li>สร้อยคอ</li>
        <li>กำไล</li>
    </ol>
    <hr>
    <a href="../index.html">กลับหน้าแรก</a>
    <!-- ใส่../เพื่อเรียก page ด้านนอกโฟล์เดอร์ -->
</body>
</html>
