<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block vs Inline</title>
    <style>
        div{
            border: 2px solid red;
        }
        span{
            border: 2px solid green;
        }
    </style>
</head>
<body>
    <h1>Bolck vs Inline</h1>

    <span>The mall life store</span>
    <span>The siam paragon</span>
    <span>The secon</span>
    <!-- span เป็นรูปแบบของ inline จะกินพื้นที่ตามขนาดของข้อความ-->
    <hr>
    <div>strawberry</div>
    <div>smartphone</div>
    <div>smart shopping cart</div>
    <!-- div เป็นรูปแบบของ block จะกินพื้นที่เต็มบรรทัด -->
</body>
</html>
