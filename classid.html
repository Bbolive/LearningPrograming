<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class & ID</title>
    <style>
        h1{
            color: red;
        }
        .b{
            color: blueviolet;
            /* ระบุ class b ให้เป็นสีต่างๆ */
        }
        #a{
            color: blue;
            /* ระบุให้ ID a เป็นสีต่างๆ */
        }
        .a{
            background-color: palevioletred;
        }
    </style>
</head>
<body>
    <h1>Class & ID</h1>
    <hr>
    <h1 class="a" id="a">skirt</h1>
    <h1 class="b">t-shirt</h1>
    <h1 id="b">sweater</h1>
    <!-- id ซ้ำกันไม่ได้ แต่ class ใส่ซ้ำกันได้ -->
    <h1>cloth</h1>
    <h1 class="c">shoe</h1>
    <hr>
    <div class="b">
        html css javascript
    </div>
    <hr>
    <span id="a">
        html caa sql
    </span>
</body>
</html>
